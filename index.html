<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ence PDS Scale Pro - Final</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
        .app-wrapper { width: 100%; max-width: 400px; background: #181818; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; border-left: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a; }

        .header { background: #202020; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .header-title { font-size: 16px; font-weight: bold; color: #00e676; }
        .bt-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #2c2c2c; color: #00e676; display: flex; align-items: center; gap: 6px; }
        .dot { height: 8px; width: 8px; background: currentColor; border-radius: 50%; display: inline-block; }

        .page { display: block; padding: 14px; flex: 1; overflow-y: auto; }

        .display-box { background: #000; border: 2px solid #333; border-radius: 12px; padding: 12px 15px; text-align: right; margin-bottom: 10px; position: relative; }
        .display-label { position: absolute; left: 12px; top: 8px; font-size: 11px; color: #00e676; text-transform: uppercase; }
        .stream-status { position: absolute; left: 12px; bottom: 8px; font-size: 11px; color: #ff9800; font-weight: bold; display: none; }
        .weight-value { font-family: 'Courier New', monospace; font-size: 40px; font-weight: bold; color: #00e676; }
        .unit { font-size: 16px; color: #00e676; }

        .quick-mode-bar { display: flex; gap: 6px; margin-bottom: 10px; }
        .quick-mode-bar select { flex: 1; padding: 8px; background: #252525; border: 1px solid #00e676; color: #fff; border-radius: 8px; font-size: 12px; font-weight: bold; }

        .preset-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
        .preset-btn { background: #252525; color: #00e676; border: 1px solid #00e676; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .key { background: #282828; border: 1px solid #383838; color: #fff; padding: 14px 0; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; user-select: none; }
        .key:active { background: #444; }
        .key-clear { background: #c62828; border: none; }
        .key-apply { background: #00e676; color: #000; font-size: 17px; grid-column: span 3; padding: 14px; margin-top: 4px; border: none; }
        .key-stop { background: #ff9800; color: #000; font-size: 14px; grid-column: span 3; padding: 10px; margin-top: 4px; border: none; display: none; }

        .test-card { background: #222; border-radius: 10px; padding: 12px; margin-top: 15px; border: 1px solid #333; }
        .test-card h4 { color: #00e676; margin-bottom: 8px; font-size: 14px; }
        .log-box { background: #000; color: #00e676; font-family: monospace; font-size: 12px; height: 120px; overflow-y: auto; padding: 10px; border-radius: 8px; border: 1px solid #333; line-height: 1.5; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div id="main-app" style="display:flex; flex-direction:column; flex:1; justify-content:space-between;">
        <div class="header">
            <div class="header-title">Ence PDS Scale Pro</div>
            <div id="top-bt-badge" class="bt-badge">
                <span class="dot"></span> <span id="top-bt-text">Bridge Ready</span>
            </div>
        </div>

        <div class="page">
            <div class="display-box">
                <span class="display-label">Target Weight</span>
                <span id="stream-indicator" class="stream-status">● SENDING...</span>
                <span class="weight-value" id="display">0.000</span>
                <span class="unit">kg</span>
            </div>

            <!-- मशीन का फ़ॉर्मेट बदलने का बार -->
            <div class="quick-mode-bar">
                <select id="data-format">
                    <option value="pds_7">Mode 1: 002.500 (PDS Standard)</option>
                    <option value="pds_6">Mode 2: 002.50 (6 Digit)</option>
                    <option value="eq_std">Mode 3: =002.500 (Equal)</option>
                    <option value="eq_rev">Mode 4: =005.200 (Reverse)</option>
                    <option value="plus_7">Mode 5: +002.500 (Plus)</option>
                    <option value="raw_no_dot">Mode 6: 002500 (No Dot)</option>
                    <option value="simple">Mode 7: 2.500 (Simple)</option>
                </select>
                <select id="end-char" style="max-width: 100px;">
                    <option value="none">End: None</option>
                    <option value="cr">End: \r Only</option>
                    <option value="crlf">End: \r\n</option>
                </select>
            </div>

            <div class="preset-row">
                <button class="preset-btn" onclick="setPreset('2.500')">2.5 Kg</button>
                <button class="preset-btn" onclick="setPreset('5.000')">5 Kg</button>
                <button class="preset-btn" onclick="setPreset('10.000')">10 Kg</button>
                <button class="preset-btn" onclick="setPreset('35.000')">35 Kg</button>
            </div>

            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key" onclick="pressKey('.')">.</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key key-clear" onclick="clearDisplay()">C</button>
                <button class="key key-apply" onclick="applyWeight()">⚡ SEND WEIGHT</button>
                <button id="stop-stream-btn" class="key key-stop" onclick="stopStreaming()">⏹️ STOP</button>
            </div>

            <div class="test-card">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <h4 style="margin:0;">📟 Transmission Log</h4>
                    <span onclick="clearLogs()" style="color:#ff5252; font-size:11px; cursor:pointer;">Clear</span>
                </div>
                <div id="log-box" class="log-box">[System] Ready...<br></div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentInput = "";

    function pressKey(num) {
        if (num === '.' && currentInput.includes('.')) return;
        if (currentInput.length > 7) return;
        currentInput += num;
        updateScreen(currentInput);
    }

    function setPreset(val) {
        currentInput = val;
        updateScreen(currentInput);
        applyWeight();
    }

    function clearDisplay() {
        currentInput = "";
        updateScreen("0.000");
        stopStreaming();
    }

    function updateScreen(val) {
        document.getElementById("display").innerText = val === "" ? "0.000" : val;
    }

    function getEndingChar() {
        const endType = document.getElementById("end-char").value;
        if (endType === "crlf") return "\r\n";
        if (endType === "cr") return "\r";
        return "";
    }

    function formatWeightString(numVal) {
        const formatType = document.getElementById("data-format").value;
        const fix3 = numVal.toFixed(3);
        const fix2 = numVal.toFixed(2);
        const pad7 = fix3.padStart(7, '0');
        const pad6 = fix2.padStart(6, '0');

        if (formatType === "pds_6") return pad6;
        if (formatType === "pds_7") return pad7;
        if (formatType === "eq_std") return "=" + pad7;
        if (formatType === "eq_rev") return "=" + pad7.split('').reverse().join('');
        if (formatType === "plus_7") return "+" + pad7;
        if (formatType === "raw_no_dot") return Math.round(numVal * 1000).toString().padStart(6, '0');
        return fix3;
    }

    function applyWeight() {
        let numVal = parseFloat(currentInput || "0");
        let fix3 = numVal.toFixed(3);
        currentInput = fix3;
        updateScreen(fix3);

        let rawPacket = formatWeightString(numVal);
        let fullPacket = rawPacket + getEndingChar();

        document.getElementById("stream-indicator").style.display = "inline";
        document.getElementById("stop-stream-btn").style.display = "block";
        addLog(`Sent -> "${rawPacket}"`);

        if (window.AppInventor) {
            window.AppInventor.setWebViewString(fullPacket);
        }
    }

    function stopStreaming() {
        document.getElementById("stream-indicator").style.display = "none";
        document.getElementById("stop-stream-btn").style.display = "none";
        if (window.AppInventor) {
            window.AppInventor.setWebViewString("");
        }
        addLog("Stopped.");
    }

    function addLog(msg) {
        const box = document.getElementById("log-box");
        box.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    function clearLogs() {
        document.getElementById("log-box").innerHTML = "";
    }
</script>
</body>
    </html>
