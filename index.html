<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro BT Scale Controller</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; min-height: 100vh; }
        .app-wrapper { width: 100%; max-width: 400px; background: #111827; display: flex; flex-direction: column; justify-content: space-between; min-height: 100vh; border-left: 1px solid #1f2937; border-right: 1px solid #1f2937; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

        /* Modern Header */
        .header { background: #1f2937; padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; }
        .header-title { font-size: 17px; font-weight: 700; color: #10b981; letter-spacing: 0.5px; }
        .bt-badge { font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 20px; background: #374151; color: #ef4444; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
        .bt-badge.connected { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        .dot { height: 8px; width: 8px; background: currentColor; border-radius: 50%; display: inline-block; }

        /* Content Area */
        .content { padding: 20px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }

        /* Professional Scale Display */
        .display-card { background: #030712; border: 2px solid #374151; border-radius: 16px; padding: 20px; text-align: right; margin-bottom: 20px; position: relative; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
        .display-label { position: absolute; left: 16px; top: 14px; font-size: 10px; font-weight: 700; color: #10b981; letter-spacing: 1px; text-transform: uppercase; }
        .weight-value { font-family: 'Courier New', Courier, monospace; font-size: 46px; font-weight: 800; color: #10b981; margin-top: 10px; }
        .unit { font-size: 20px; color: #10b981; font-weight: 600; margin-left: 4px; }

        /* Quick Preset Buttons */
        .preset-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
        .preset-btn { background: #1f2937; color: #10b981; border: 1px solid #374151; padding: 10px 0; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .preset-btn:active { background: #374151; transform: scale(0.96); }

        /* Clean Keypad */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .key { background: #1f2937; border: 1px solid #374151; color: #fff; padding: 16px 0; font-size: 22px; font-weight: 700; border-radius: 12px; cursor: pointer; user-select: none; text-align: center; transition: background 0.15s; }
        .key:active { background: #4b5563; }
        .key-clear { background: #7f1d1d; border-color: #991b1b; color: #fca5a5; }
        .key-apply { background: #10b981; color: #030712; font-size: 16px; font-weight: 800; grid-column: span 3; padding: 18px; border: none; border-radius: 12px; cursor: pointer; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .key-apply:active { opacity: 0.9; transform: scale(0.98); }

        /* Bluetooth Control Card */
        .bt-card { background: #1f2937; border-radius: 14px; padding: 16px; text-align: center; border: 1px solid #374151; }
        .scan-btn { background: #2563eb; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .disconnect-btn { background: #dc2626; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 10px; margin-top: 8px; cursor: pointer; font-weight: 600; display: none; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- Header -->
    <div class="header">
        <div class="header-title">Smart Scale Pro</div>
        <div id="top-bt-badge" class="bt-badge">
            <span class="dot"></span> <span id="top-bt-text">Disconnected</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div>
            <!-- Display Box -->
            <div class="display-card">
                <span class="display-label">Target Weight Output</span>
                <span class="weight-value" id="display">0.000</span>
                <span class="unit">kg</span>
            </div>

            <!-- Quick Presets -->
            <div class="preset-grid">
                <button class="preset-btn" onclick="setPreset('5.000')">5 Kg</button>
                <button class="preset-btn" onclick="setPreset('10.000')">10 Kg</button>
                <button class="preset-btn" onclick="setPreset('20.500')">20.5 Kg</button>
                <button class="preset-btn" onclick="setPreset('35.000')">35 Kg</button>
            </div>

            <!-- Keypad Layout -->
            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key" onclick="pressKey('.')">.</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key key-clear" onclick="clearDisplay()">C</button>
                <button class="key key-apply" onclick="applyWeight()">⚡ APPLY & TRANSMIT WEIGHT</button>
            </div>
        </div>

        <!-- Bluetooth Management -->
        <div class="bt-card">
            <div style="font-size: 13px; font-weight: 600; color: #9ca3af; margin-bottom: 4px;">Hardware Link</div>
            <button class="scan-btn" onclick="scanAndConnect()">🔍 Connect Bluetooth Device</button>
            <button id="disconnect-btn" class="disconnect-btn" onclick="disconnectBT()">❌ Disconnect Device</button>
        </div>
    </div>
</div>

<script>
    let currentInput = "";

    function pressKey(num) {
        if (num === '.' && currentInput.includes('.')) return;
        if (currentInput.length > 7) return;
        currentInput += num;
        updateScreen(currentInput);
    }

    function setPreset(val) {
        currentInput = val;
        updateScreen(currentInput);
    }

    function clearDisplay() {
        currentInput = "";
        updateScreen("0.000");
    }

    function updateScreen(val) {
        document.getElementById("display").innerText = val === "" ? "0.000" : val;
    }

    let bluetoothDevice = null;
    let txCharacteristic = null;

    async function scanAndConnect() {
        try {
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e', 0xFFE0]
            });
            
            const deviceName = bluetoothDevice.name || "Connected Scale";
            const server = await bluetoothDevice.gatt.connect();
            
            document.getElementById("top-bt-badge").classList.add("connected");
            document.getElementById("top-bt-text").innerText = deviceName;
            document.getElementById("disconnect-btn").style.display = "block";

            const services = await server.getPrimaryServices();
            if (services.length > 0) {
                const characteristics = await services[0].getCharacteristics();
                txCharacteristic = characteristics[0];
            }
            alert("Success: Connected to " + deviceName);
        } catch (error) {
            alert("Connection Failed: " + error.message);
        }
    }

    function disconnectBT() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) bluetoothDevice.gatt.disconnect();
        txCharacteristic = null;
        document.getElementById("top-bt-badge").classList.remove("connected");
        document.getElementById("top-bt-text").innerText = "Disconnected";
        document.getElementById("disconnect-btn").style.display = "none";
        alert("Device disconnected successfully.");
    }

    async function applyWeight() {
        let finalWeight = parseFloat(currentInput || "0").toFixed(3);
        updateScreen(finalWeight);
        let dataString = `=${finalWeight.padStart(7, '0')}\r\n`;

        if (txCharacteristic) {
            try {
                await txCharacteristic.writeValue(new TextEncoder().encode(dataString));
                alert(`Data Transmitted: ${finalWeight} Kg`);
            } catch (err) {
                alert("Transmission Error: " + err.message);
            }
        } else {
            alert(`Simulation Mode (No BT Device Connected)\nWeight Set: ${finalWeight} Kg`);
        }
    }
</script>
</body>
                    </html>
